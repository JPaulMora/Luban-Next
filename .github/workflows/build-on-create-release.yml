name: Build on Release created

on:
    release:
        types:
            - created
    workflow_dispatch:
        inputs:
            target:
                description: Which packages to build
                required: false
                default: all
                type: choice
                options:
                    - all
                    - windows
                    - macos
                    - linux

permissions:
    contents: write

jobs:

    build-windows:
        name: Build Windows Packages
        if: github.event_name == 'release' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows'

        runs-on: windows-2022

        steps:
            - name: Prepare VC++ Runtime
              run: choco install -y vcredist2017

            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Checkout submodules
              shell: bash
              run: |
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git submodule update --init --recursive

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Expose python3
              shell: bash
              run: |
                  if ! command -v python3 >/dev/null 2>&1; then
                      py="$(command -v python)"
                      mkdir -p "$HOME/bin"
                      ln -sf "$py" "$HOME/bin/python3"
                      echo "$HOME/bin" >> "$GITHUB_PATH"
                  fi

            - name: Install setuptools
              run: python -m pip install --upgrade "setuptools<81"

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - run: npm install -g npm@^9
            - run: npm install

            - run: npm run build

            - name: Build Windows x64 Binaries
              run: npm run build:win-x64

            - name: Release on Github
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ github.event.release.tag_name || 'v4.17.0' }}
                  files: |
                      ./output/*.exe
                      ./output/latest.yml

    build-macos-x64:
        name: Build macOS x64 Packages
        if: github.event_name == 'release' || github.event.inputs.target == 'all' || github.event.inputs.target == 'macos'

        runs-on: macos-15-intel

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Checkout submodules
              run: |
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git submodule update --init --recursive

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install setuptools
              run: python -m pip install --upgrade "setuptools<81"

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - run: npm install -g npm@^9
            - run: npm install

            - run: npm run build

            - name: Build macOS x64 Binaries
              run: npm run build:mac-x64

            - name: Release on Github
              uses: softprops/action-gh-release@v1
              with:
                  # Keep the Apple Silicon latest-mac.yml already on the release.
                  tag_name: ${{ github.event.release.tag_name || 'v4.17.0' }}
                  files: |
                      ./output/*.zip
                      ./output/*.dmg
                      ./output/*.zip.blockmap
                      ./output/*.dmg.blockmap

    build-linux:
        name: Build Linux Packages
        if: github.event_name == 'release' || github.event.inputs.target == 'all' || github.event.inputs.target == 'linux'

        runs-on: ubuntu-22.04

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Checkout submodules
              run: |
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git submodule update --init --recursive

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y python3 make g++ build-essential fontconfig libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev rpm fakeroot

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install setuptools
              run: python -m pip install --upgrade "setuptools<81"

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - run: npm install -g npm@^9 --unsafe-perm
            - run: npm install --unsafe-perm

            - run: npm run build

            - name: Build Linux x64 Binaries
              run: npm run build:linux-x64

            - name: Pack Linux directory
              run: |
                  PACKAGE_NAME="Snapmaker-luban"
                  PACKAGE_VERSION=`node -e "console.log(require('./src/package.json').version)"`
                  RELEASE=${PACKAGE_NAME}-${PACKAGE_VERSION}

                  ln -sf ./output/linux-unpacked "${RELEASE}-linux-x64"
                  tar zcfh "./output/${RELEASE}-linux-x64.tar.gz" "${RELEASE}-linux-x64"
                  rm -f "${RELEASE}-linux-x64"

            - name: Release on Github
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ github.event.release.tag_name || 'v4.17.0' }}
                  files: |
                      ./output/*.deb
                      ./output/*.rpm
                      ./output/*.tar.gz
